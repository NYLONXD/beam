[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beam-lan"
dynamic = ["version"]
description = "Move a project folder from one laptop to another over the local network."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nylonxd", email = "Himanshujha202005@gmail.com" }]
keywords = ["file-transfer", "lan", "sync", "project", "tar", "cli", "local-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Archiving",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/NYLONXD/beam"
Source = "https://github.com/NYLONXD/beam"
Issues = "https://github.com/NYLONXD/beam/issues"
Changelog = "https://github.com/NYLONXD/beam/blob/main/CHANGELOG.md"

[project.scripts]
beam = "beam.cli:main"

[tool.hatch.version]
path = "src/beam/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beam"]

[tool.hatch.build.targets.sdist]
include = ["src/beam", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]